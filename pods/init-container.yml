apiVersion: v1
kind: Pod
metadata:
  name: init-test-pod

spec:
  initContainers:
  - name: init-container
    image: busybox
    command:
      - sh
      - -c
      - |
        echo "Initializing..."
        sleep 5
        echo "Initialization complete."

  containers:
  - name: main-container
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        echo "Running main container..."
        sleep 3600

    ports:
    - containerPort: 80

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

  tolerations:
  - key: "prod"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"