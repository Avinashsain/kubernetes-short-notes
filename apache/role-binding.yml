kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: apache-manager-binding
  namespace: apache
roleRef:
  kind: Role
  name: apache-manager
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: apache-user
  apiGroup: ""        # must be empty string for ServiceAccount
  namespace: apache   # always specify namespace for ServiceAccount subjects